# Self-hosted Mavyn: API + web app + PostgreSQL.
#   cp infrastructure/docker/.env.example infrastructure/docker/.env   # then edit secrets
#   docker compose -f infrastructure/docker/compose.yaml up -d --build
# The first start logs a one-time setup token:  docker compose ... logs server | grep "setup token"
name: mavyn

services:
  db:
    image: postgres:15.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdreader
      POSTGRES_USER: mdreader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdreader -d mdreader"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published: only the server talks to the database.

  server:
    build:
      context: ../..
      dockerfile: infrastructure/docker/server.Dockerfile
    image: mavyn:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mdreader:${POSTGRES_PASSWORD}@db:5432/mdreader
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-16777216}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # Bind to localhost by default; expose through a TLS reverse proxy (see docs/deployment.md).
      - "${BIND_HOST:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    # Migrations run at startup inside a transaction; a failed migration stops the server
    # instead of serving with a half-applied schema.
    stop_grace_period: 20s

volumes:
  db-data:
