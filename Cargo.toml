[workspace]
resolver = "2"
members = ["apps/server", "crates/domain", "crates/sync-protocol"]
# The Tauri shell builds separately: it needs WebKitGTK/WebView2 system libraries.
exclude = ["apps/desktop/src-tauri", "crates/local-store", "crates/tauri-plugin-mavyn-files", "crates/native-sync"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
