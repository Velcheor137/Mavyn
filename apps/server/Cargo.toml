[package]
name = "mdr-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mdr-domain = { path = "../../crates/domain" }
mdr-sync-protocol = { path = "../../crates/sync-protocol" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "trace", "set-header", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros", "migrate", "json"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
base64 = "0.22"
unicode-normalization = "0.1"
tracing = "0.1"
# Text of docx/xlsx/ods/pdf for API and MCP readers (src/extract.rs). zip is pinned so calamine
# does not pull a release younger than a couple of weeks.
calamine = "0.38"
zip = { version = "=9.2.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdf-extract = "0.12"
# MCP server (src/mcp.rs). Pinned: the SDK moves fast and a version should be a few weeks old.
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"

[lints]
workspace = true
