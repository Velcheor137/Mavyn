[package]
name = "mavyn-desktop"
version = "0.1.1"
edition = "2021"
license = "MIT"

[lib]
name = "mdr_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
mavyn-local-store = { path = "../../../crates/local-store" }
mavyn-native-sync = { path = "../../../crates/native-sync" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-mavyn-files = { path = "../../../crates/tauri-plugin-mavyn-files" }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"

[lints.rust]
unsafe_code = "forbid"
