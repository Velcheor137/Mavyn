name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version']
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              tag = os.environ['GITHUB_REF_NAME']
              assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Invalid version tag'
              assert tag == 'v' + version, 'Tag must match Tauri version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: rustup default 1.95.0
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --maxWorkers 2
      - name: Prepare verified Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-nsis.ps1
      - name: Bundle
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --ci
      - name: Collect required artifacts
        shell: python
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          import os, pathlib, shutil
          out = pathlib.Path('release-artifacts'); out.mkdir()
          root = pathlib.Path('apps/desktop/src-tauri/target/release/bundle')
          suffixes = ['exe'] if os.environ['PLATFORM'].startswith('windows') else ['deb', 'rpm']
          for suffix in suffixes:
              found = list(root.rglob('*.' + suffix))
              assert len(found) == 1, f'Expected one {suffix}, found {found}'
              shutil.copyfile(found[0], out / f"Mavyn-{os.environ['VERSION']}-{os.environ['PLATFORM']}.{suffix}")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
  android:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
      - run: rustup default 1.95.0
      - run: bash scripts/android-sdk.sh
      - run: bash scripts/ci-gradle.sh
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.MAVYN_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MAVYN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAVYN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAVYN_ANDROID_KEY_PASSWORD }}
          CERTIFICATE: ${{ vars.MAVYN_ANDROID_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          for name in ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD', 'CERTIFICATE']:
              assert os.environ.get(name), f'Missing Android signing configuration: {name}'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mavyn-release.p12'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write(f'MAVYN_KEYSTORE={path}\n')
          PY
      - name: Build signed ARM64 release
        working-directory: apps/desktop
        env:
          MAVYN_KEYSTORE_PASSWORD: ${{ secrets.MAVYN_ANDROID_KEYSTORE_PASSWORD }}
          MAVYN_KEY_ALIAS: ${{ secrets.MAVYN_ANDROID_KEY_ALIAS }}
          MAVYN_KEY_PASSWORD: ${{ secrets.MAVYN_ANDROID_KEY_PASSWORD }}
          CARGO_BUILD_JOBS: '2'
        run: npm run tauri -- android build --apk --split-per-abi --target aarch64 --ci
      - name: Verify and collect release APK
        env:
          CERTIFICATE: ${{ vars.MAVYN_ANDROID_CERT_SHA256 }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=apps/desktop/src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk
          python3 scripts/verify-apk.py "$apk" --certificate "$CERTIFICATE" --version "$VERSION"
          mkdir release-artifacts
          cp "$apk" "release-artifacts/Mavyn-$VERSION-android-arm64.apk"
      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mavyn-release.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android-arm64
          path: release-artifacts/*
          if-no-files-found: error
  aggregate:
    needs: [validation, version, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify complete set and checksum
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          root = pathlib.Path('release-artifacts'); version = os.environ['VERSION']
          required = {f'Mavyn-{version}-{suffix}' for suffix in ['windows-x64.exe', 'linux-x86_64.deb', 'linux-x86_64.rpm', 'android-arm64.apk']}
          assert {p.name for p in root.iterdir()} == required, 'Incomplete or unexpected release artifacts'
          lines = []
          for p in sorted(root.iterdir()):
              assert p.stat().st_size > 100000, f'Artifact too small: {p.name}'
              lines.append(hashlib.file_digest(p.open('rb'), 'sha256').hexdigest() + '  ' + p.name)
          (root / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-release
          path: release-artifacts/*
          if-no-files-found: error
  publish:
    needs: aggregate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: complete-release
          path: release-artifacts
      - name: Publish only after all required packages succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/draft")" = true || { echo 'Refusing to modify an already published release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false
          fi
  container:
    needs: [publish, version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      publish: true
      version: ${{ needs.version.outputs.version }}
