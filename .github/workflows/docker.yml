name: Server container
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run actual image with database migrations
        run: |
          docker build -f infrastructure/docker/server.Dockerfile -t mavyn:smoke .
          docker network create mavyn-smoke
          docker run -d --name mavyn-db --network mavyn-smoke -e POSTGRES_USER=mavyn -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=mavyn postgres:15.13-bookworm
          for i in $(seq 1 30); do docker exec mavyn-db pg_isready -U mavyn && break; sleep 2; done
          docker exec mavyn-db pg_isready -U mavyn
          docker run -d --name mavyn-server --network mavyn-smoke -p 127.0.0.1:18080:8080 -e DATABASE_URL=postgres://mavyn:ci-only@mavyn-db:5432/mavyn mavyn:smoke
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18080/api/v1/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/api/v1/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<html'
      - name: Cleanup owned smoke containers
        if: always()
        run: |
          docker rm -f mavyn-server mavyn-db || true
          docker network rm mavyn-smoke || true
  multiarch:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compute immutable version tag
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" == "v$VERSION" ]] || exit 1
            echo "TAGS=$image:$VERSION" >> "$GITHUB_ENV"
          else
            echo "TAGS=$image:check-$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infrastructure/docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish || false }}
          tags: ${{ env.TAGS }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
